# ---
#    Use this file to select the overtake controller node for each of the
#    different simulator sessions for the opponent (overtker) car. 
#    These can be found in the overtake_controller/ node. The options are:
#
#       - "overtake"              - the regular overtake implementation (overtake.py)
#       - "overtake_aggressive"   - aggressive implementation (overtake_aggressive.py)
#       - "overtake_left"         - implementation that favors passing on the left (overtake_left.py)
#       - "overtake_right"        - implementation that favors passing on the right (overtake_right.py)
#       - "overtake_conservative" - more cautious than the normal (overtake_conservative.py) 
# ---

overtake_profiles:
  session_1:
    controller_node: "overtake"
  session_2:
    controller_node: "overtake_aggressive"
  session_3:
    controller_node: "overtake_right"